name: Release (Ventura build)

# Builds the universal `imsg` + bridge helper with the macOS 13 deployment target and attaches
# `imsg-macos.zip` to a GitHub release. Ad-hoc signed (no notarization): the only consumer is
# charliemeyer2000/homebrew-tap, installed on a Mac we own.

on:
  push:
    tags: ["v*-ventura.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          swift --version
      - name: Resolve and patch SwiftPM dependencies
        run: |
          scripts/generate-version.sh
          swift package resolve
          scripts/patch-deps.sh
      - name: Build universal (deployment target macOS 13)
        run: make build
      - name: Verify deployment target
        run: |
          for f in bin/imsg bin/imsg-bridge-helper.dylib; do
            for arch in x86_64 arm64; do
              minos=$(otool -arch "$arch" -l "$f" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos/{print $2; exit}')
              echo "$f $arch minos $minos"
              [[ "$minos" == 13.0 ]]
            done
          done
          bin/imsg --version
      - name: Archive
        run: |
          cd bin
          zip -ry ../imsg-macos.zip imsg imsg-bridge-helper.dylib *.bundle
          cd ..
          shasum -a 256 imsg-macos.zip | tee imsg-macos.zip.sha256
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            `imsg` ${{ github.ref_name }} built with the macOS 13 (Ventura) deployment target.
            Fork of openclaw/imsg; upstream supports macOS 14+ only. Ad-hoc signed.
          files: |
            imsg-macos.zip
            imsg-macos.zip.sha256
